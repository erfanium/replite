[package]
name = "replite"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sqld"
path = "src/main.rs"

[[bin]]
name = "binlog-inspect"
path = "src/bin/binlog_inspect.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros", "json"] }
base64 = "0.23.1"
bytes = "1.10.1"
futures-util = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
prost = { version = "0.14.4", features = ["derive"] }
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["bundled", "preupdate_hook", "backup", "column_decltype"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.20.0"
tower = { version = "0.5.2", features = ["util"] }
